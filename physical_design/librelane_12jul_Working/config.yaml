# GF180MCU LibreLane config -- ASCON 128 Core
 
meta:
  version: 3
  flow: Classic

FALLBACK_SDC: dir::constraints.sdc
PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc

# ============================================================
# Ban ALL delay cells to prevent repair_design infinite loops
# ============================================================
EXTRA_EXCLUDED_CELLS:
  - "gf180mcu_fd_sc_mcu7t5v0__buf_1"
  - "gf180mcu_fd_sc_mcu7t5v0__inv_1"
  - "gf180mcu_fd_sc_mcu7t5v0__dlya_1"
  - "gf180mcu_fd_sc_mcu7t5v0__dlya_2"
  - "gf180mcu_fd_sc_mcu7t5v0__dlya_4"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyb_1"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyb_2"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyb_4"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyc_1"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyc_2"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyc_4"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyd_1"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyd_2"
  - "gf180mcu_fd_sc_mcu7t5v0__dlyd_4"

# Cell padding: minimal to avoid over-constraining placement
GPL_CELL_PADDING: 1
DPL_CELL_PADDING: 1
DIODE_PADDING: 0

# 1. Top Module
DESIGN_NAME: ascon_core_adpt_encdec

# 2. Verilog source
VERILOG_FILES:
  - dir::design.v

# 3. Clock
CLOCK_PORT: clk

# 4. Target Freq: 25 MHz = 40ns period
CLOCK_PERIOD: 40.0

# Timing corners
LIB:
  "*_tt_025C_3v30":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ss_125C_3v00":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib
  "*_ff_n40C_3v60":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib

DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS:
  - nom_tt_025C_3v30
  - max_ss_125C_3v00
  - min_ff_n40C_3v60
 
FP_SIZING: absolute
DIE_AREA: [0.0, 0.0, 850.0, 850.0]

# Power / ground
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Signoff / streamout
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Routing
RT_MAX_LAYER: Metal5
RT_CLOCK_MIN_LAYER: Metal3
RT_CLOCK_MAX_LAYER: Metal5
PDN_MULTILAYER: false

# Antenna repair:  
RUN_ANTENNA_REPAIR: true
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true
GRT_ANTENNA_REPAIR_MARGIN: 20
GRT_ANTENNA_REPAIR_ITERS: 10


# Power distribution network
 
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 50
PDN_HPITCH: 50
PDN_EXTEND_TO: boundary

# ============================================================
PL_TARGET_DENSITY_PCT: 60
SYNTH_STRATEGY: "AREA 0"
SYNTH_BUFFER_CELL: "gf180mcu_fd_sc_mcu7t5v0__buf_4/I/Z"
SYNTH_SPLITNETS: true

# Margins (reduced for compact die)
TOP_MARGIN_MULT: 2
BOTTOM_MARGIN_MULT: 2
LEFT_MARGIN_MULT: 2
RIGHT_MARGIN_MULT: 2

# Workaround for OpenROAD Signal 6 CTS Crash
CTS_SINK_CLUSTERING_ENABLE: false

# Avoid DRT-0073 pin access errors on clkbuf_8 and clkbuf_16
CTS_ROOT_BUFFER: "gf180mcu_fd_sc_mcu7t5v0__clkbuf_4"
CTS_CLK_BUFFERS: ["gf180mcu_fd_sc_mcu7t5v0__clkbuf_2", "gf180mcu_fd_sc_mcu7t5v0__clkbuf_4"]

# Placement and routing tweaks
GRT_ALLOW_CONGESTION: true
HEURISTIC_ANTENNA_THRESHOLD: 40
PL_MAX_DISPLACEMENT_Y: 100
PL_RESIZER_SETUP_SLACK_MARGIN: 0.1
PL_RESIZER_HOLD_SLACK_MARGIN: 0.3
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Timing Closure Best Practices (from Shalan's guide)
# Prioritize Hold fixing over Setup fixing (hold violations will break the chip permanently)
RUN_POST_CTS_RESIZER_TIMING: true
PL_RESIZER_ALLOW_SETUP_VIOS: false
GRT_RESIZER_ALLOW_SETUP_VIOS: false

# Signoff overrides
ERROR_ON_MAGIC_DRC: False

MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

KLAYOUT_DRC_THREADS: 1
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
